<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mancala | Daniel Dombrovsky</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #171219; color: #faecd2;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    #display { position: fixed; inset: 0; }
    #status { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; padding: 24px; text-align: center; background: #171219;
      transition: opacity 0.4s ease; }
    #status.hidden { opacity: 0; pointer-events: none; }
    .stones { display: flex; gap: 10px; margin-bottom: 8px; }
    .stones span { width: 18px; height: 18px; border-radius: 50%; animation: hop 1.2s ease-in-out infinite; }
    .stones span:nth-child(1) { background: #ce4254; }
    .stones span:nth-child(2) { background: #e4dece; animation-delay: 0.15s; }
    .stones span:nth-child(3) { background: #34a89e; animation-delay: 0.3s; }
    .stones span:nth-child(4) { background: #4a76d6; animation-delay: 0.45s; }
    .stones span:nth-child(5) { background: #ecaa3a; animation-delay: 0.6s; }
    @keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-14px); } }
    h1 { margin: 0; font-size: 28px; }
    p { margin: 0; color: rgba(250, 236, 210, 0.6); max-width: 440px; line-height: 1.5; }
    a { color: #ffcd6e; }
  </style>
  <script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
</head>
<body>
  <div id="status" role="status">
    <div class="stones" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    <h1>Starting Mancala</h1>
    <p id="message"></p>
  </div>
  <div id="display"></div>
  <script>
    (async () => {
      const status = document.getElementById("status");
      const display = document.getElementById("display");
      const reveal = () => status.classList.add("hidden");
      try {
        await cheerpjInit({
          version: 11,
          // The game calls this once its window has painted, so the loading screen covers the whole start-up.
          natives: { async Java_ui_MancalaGUI_gameShown() { setTimeout(reveal, 200); } },
        });
        cheerpjCreateDisplay(-1, -1, display);
        await cheerpjRunJar("/app/mancala-game/mancala.jar", "--browser");
      } catch (error) {
        console.error(error);
        status.classList.remove("hidden");
        status.querySelector("h1").textContent = "The game could not start";
        document.getElementById("message").innerHTML =
          'Your browser could not run the Java runtime. You can <a href="mancala.jar" download>download the game</a> ' +
          "and run it with Java 11 or newer instead.";
      }
    })();
  </script>
</body>
</html>
